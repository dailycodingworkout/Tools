# Git Branch Migrator Configuration File
# This file contains the configuration for migrating branches from a source repository
# to a target repository while preserving git history

# Source repository (the repository you want to copy branches from)
# This should be the full URL or path to the "doo" repository
SOURCE_REPO="https://github.com/username/doo.git"

# Target repository (your personal repository where you want to copy the branches)
# This should be the full URL or path to your "base" repository
TARGET_REPO="https://github.com/yourusername/base.git"

# List of branches to migrate from the source repository
# Add all the version branches you want to copy
BRANCHES=(
    "master"
    "18.0"
    "17.0"
    "16.0"
    "15.0"
)

# Target folder names for each branch
# These will be the folder names in your target repository
# Each branch content will be organized into its corresponding folder
TARGET_FOLDERS=(
    "master"
    "v18"
    "v17"
    "v16"
    "v15"
)

# Migration options
PRESERVE_HISTORY=true
VERBOSE=false

# Additional settings
# Set to true if you want detailed output during migration
# VERBOSE=true

# Example usage:
# 1. Edit this configuration file with your repository URLs and branch information
# 2. Run: ./git-branch-migrator.sh -c migration-config.conf
#
# The script will:
# - Clone your source repository (doo)
# - Create or clone your target repository (base)
# - Copy each specified branch with complete git history
# - Organize content into the specified folders
# - Preserve all commit messages, authors, and timestamps
# - Generate a migration report
# - Push everything to your target repository