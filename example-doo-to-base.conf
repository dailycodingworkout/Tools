# Example Configuration for the Specific Use Case
# This configuration is tailored for migrating from "doo" repository to "base" repository
# with version branches 18.0, 17.0, 16.0, 15.0 and master

# Source repository (replace with actual URL to "doo" repository)
# Example formats:
# - HTTPS: "https://github.com/username/doo.git"
# - SSH: "git@github.com:username/doo.git" 
# - Local path: "/path/to/local/doo/repository"
SOURCE_REPO="https://github.com/username/doo.git"

# Target repository (replace with your actual "base" repository URL)
# This should be your personal repository where you want to copy everything
TARGET_REPO="https://github.com/yourusername/base.git"

# Branches to migrate from the source repository
# These are the exact branch names as they exist in the "doo" repository
BRANCHES=(
    "master"    # Main branch
    "18.0"      # Version 18.0 branch
    "17.0"      # Version 17.0 branch
    "16.0"      # Version 16.0 branch
    "15.0"      # Version 15.0 branch
)

# Target folder names for organizing content in your "base" repository
# Each branch will be organized into its corresponding folder
TARGET_FOLDERS=(
    "master"    # Master branch content goes to "master" folder
    "v18"       # 18.0 branch content goes to "v18" folder  
    "v17"       # 17.0 branch content goes to "v17" folder
    "v16"       # 16.0 branch content goes to "v16" folder
    "v15"       # 15.0 branch content goes to "v15" folder
)

# Migration options
PRESERVE_HISTORY=true  # Preserve complete git history
VERBOSE=false          # Set to true for detailed output

# Instructions for use:
# 1. Replace "username" with the actual owner of the "doo" repository
# 2. Replace "yourusername" with your actual GitHub username
# 3. Ensure you have access to both repositories
# 4. Run: ./git-branch-migrator.sh -c example-doo-to-base.conf
#
# After migration, your "base" repository will have:
# base/
# ├── master/     (content from master branch)
# ├── v18/        (content from 18.0 branch)
# ├── v17/        (content from 17.0 branch) 
# ├── v16/        (content from 16.0 branch)
# ├── v15/        (content from 15.0 branch)
# └── MIGRATION_REPORT.md
#
# All git history, commit messages, and author information will be preserved,
# making it fully compatible with GitHub Copilot for code analysis.